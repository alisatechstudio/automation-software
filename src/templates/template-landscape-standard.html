<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <title>Landscape News Template (1200x630)</title>
  <style>
    @font-face {
      font-family: 'Hind Siliguri';
      src: url('{{{fontHindSiliguriBold}}}') format('truetype');
      font-weight: 700;
      font-style: normal;
    }
    @font-face {
      font-family: 'Noto Sans Bengali';
      src: url('{{{fontNotoSansBengali}}}') format('truetype');
      font-weight: 400;
      font-style: normal;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
      background: #090d16;
      font-family: 'Hind Siliguri', 'Noto Sans Bengali', sans-serif;
      display: flex;
    }

    /* Left Photo Area (54%) */
    .left-photo {
      width: 640px;
      height: 630px;
      position: relative;
      overflow: hidden;
      background: #111827;
      flex-shrink: 0;
    }

    .left-photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .photo-fade {
      position: absolute;
      top: 0;
      right: 0;
      width: 180px;
      height: 100%;
      background: linear-gradient(to right, rgba(9, 13, 22, 0), #090d16 100%);
    }

    /* Right Content Area (46%) */
    .right-content {
      flex: 1;
      height: 630px;
      padding: 44px 44px 36px 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      z-index: 5;
    }

    .header-group {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo img {
      height: 44px;
    }

    .category-badge {
      background: #e11d48;
      color: #ffffff;
      padding: 6px 18px;
      border-radius: 6px;
      font-size: 20px;
      font-weight: 700;
      text-transform: uppercase;
    }

    /* Auto-fitting Headline Box */
    .headline-container {
      width: 100%;
      height: 380px;
      display: flex;
      align-items: center;
      overflow: hidden;
    }

    .headline-text {
      width: 100%;
      font-family: 'Hind Siliguri', sans-serif;
      font-size: 44px;
      line-height: 1.35;
      font-weight: 700;
      color: #f8fafc;
      word-break: break-word;
    }

    /* Footer Metadata */
    .footer-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid rgba(255, 255, 255, 0.12);
      padding-top: 12px;
    }

    .date-text {
      color: #94a3b8;
      font-size: 18px;
      font-family: 'Noto Sans Bengali', sans-serif;
    }

    .source-tag {
      color: #38bdf8;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>
  <div class="left-photo">
    <img src="{{{imageUrl}}}" alt="News Photo" onerror="this.src='{{{fallbackImage}}}';" />
    <div class="photo-fade"></div>
  </div>

  <div class="right-content">
    <div class="header-group">
      <div class="logo">
        <img src="{{{logoUrl}}}" alt="Logo" />
      </div>
      <div class="category-badge">{{category}}</div>
    </div>

    <div class="headline-container" id="headline-container">
      <h1 class="headline-text" id="headline-text">{{headline}}</h1>
    </div>

    <div class="footer-bar">
      <div class="date-text">{{dateText}}</div>
      <div class="source-tag">LIVE UPDATES</div>
    </div>
  </div>

  <script>
    function autoFit() {
      const container = document.getElementById('headline-container');
      const text = document.getElementById('headline-text');
      if (!container || !text) return;

      let fontSize = 44;
      const minFontSize = 20;
      text.style.fontSize = fontSize + 'px';
      text.style.lineHeight = (fontSize * 1.35) + 'px';

      while (
        (text.scrollHeight > container.clientHeight || text.scrollWidth > container.clientWidth) &&
        fontSize > minFontSize
      ) {
        fontSize -= 1;
        text.style.fontSize = fontSize + 'px';
        text.style.lineHeight = (fontSize * 1.35) + 'px';
      }
    }
    autoFit();
    window.addEventListener('load', autoFit);
  </script>
</body>
</html>
