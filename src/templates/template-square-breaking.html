<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <title>Breaking News Template</title>
  <style>
    @font-face {
      font-family: 'Hind Siliguri';
      src: url('{{{fontHindSiliguriBold}}}') format('truetype');
      font-weight: 700;
      font-style: normal;
    }
    @font-face {
      font-family: 'Noto Sans Bengali';
      src: url('{{{fontNotoSansBengali}}}') format('truetype');
      font-weight: 400;
      font-style: normal;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 1080px;
      height: 1080px;
      overflow: hidden;
      background: #090d16;
      font-family: 'Hind Siliguri', 'Noto Sans Bengali', sans-serif;
      position: relative;
    }

    /* News Photo Section (Top ~62%) */
    .photo-wrapper {
      position: absolute;
      top: 0;
      left: 0;
      width: 1080px;
      height: 680px;
      overflow: hidden;
      background: #111827;
    }

    .photo-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Dramatic Dark Gradient Overlay */
    .gradient-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 1080px;
      height: 680px;
      background: linear-gradient(
        to bottom,
        rgba(9, 13, 22, 0.4) 0%,
        rgba(9, 13, 22, 0.1) 40%,
        rgba(9, 13, 22, 0.85) 85%,
        #090d16 100%
      );
    }

    /* Header Bar: Logo & Badge */
    .header-bar {
      position: absolute;
      top: 36px;
      left: 48px;
      right: 48px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }

    .logo-container img {
      height: 52px;
      filter: drop-shadow(0 4px 10px rgba(0,0,0,0.6));
    }

    .category-badge {
      background: #e11d48;
      color: #ffffff;
      padding: 8px 24px;
      border-radius: 6px;
      font-size: 26px;
      font-weight: 700;
      letter-spacing: 0.5px;
      box-shadow: 0 4px 14px rgba(225, 29, 72, 0.45);
      text-transform: uppercase;
    }

    /* Breaking Ribbon */
    .breaking-ribbon {
      position: absolute;
      top: 615px;
      left: 48px;
      background: #dc2626;
      color: #ffffff;
      padding: 6px 18px;
      border-radius: 4px;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 1px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      z-index: 10;
    }

    .pulsing-dot {
      width: 10px;
      height: 10px;
      background-color: #ffffff;
      border-radius: 50%;
    }

    /* Bottom Content Section */
    .content-section {
      position: absolute;
      top: 665px;
      left: 48px;
      right: 48px;
      bottom: 40px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      z-index: 10;
    }

    /* Auto-fitting Headline Box */
    .headline-container {
      width: 100%;
      height: 290px;
      display: flex;
      align-items: center;
      overflow: hidden;
    }

    .headline-text {
      width: 100%;
      font-family: 'Hind Siliguri', sans-serif;
      font-size: 52px;
      line-height: 1.35;
      font-weight: 700;
      color: #f8fafc;
      text-shadow: 0 3px 8px rgba(0,0,0,0.7);
      word-break: break-word;
      overflow-wrap: break-word;
    }

    /* Footer Metadata */
    .footer-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid rgba(255, 255, 255, 0.15);
      padding-top: 14px;
    }

    .date-text {
      color: #94a3b8;
      font-size: 20px;
      font-family: 'Noto Sans Bengali', sans-serif;
    }

    .brand-tag {
      color: #cbd5e1;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>
  <div class="photo-wrapper">
    <img src="{{{imageUrl}}}" alt="News Photo" onerror="this.src='{{{fallbackImage}}}';" />
    <div class="gradient-overlay"></div>
  </div>

  <div class="header-bar">
    <div class="logo-container">
      <img src="{{{logoUrl}}}" alt="Brand Logo" />
    </div>
    <div class="category-badge">{{category}}</div>
  </div>

  <div class="breaking-ribbon">
    <div class="pulsing-dot"></div>
    ব্রেকিং আপডেট
  </div>

  <div class="content-section">
    <div class="headline-container" id="headline-container">
      <h1 class="headline-text" id="headline-text">{{headline}}</h1>
    </div>

    <div class="footer-bar">
      <div class="date-text">{{dateText}}</div>
      <div class="brand-tag">NEWS24 ONLINE</div>
    </div>
  </div>

  <script>
    function autoFit() {
      const container = document.getElementById('headline-container');
      const text = document.getElementById('headline-text');
      if (!container || !text) return;

      let fontSize = 54;
      const minFontSize = 24;
      text.style.fontSize = fontSize + 'px';
      text.style.lineHeight = (fontSize * 1.35) + 'px';

      while (
        (text.scrollHeight > container.clientHeight || text.scrollWidth > container.clientWidth) &&
        fontSize > minFontSize
      ) {
        fontSize -= 1;
        text.style.fontSize = fontSize + 'px';
        text.style.lineHeight = (fontSize * 1.35) + 'px';
      }
    }
    autoFit();
    window.addEventListener('load', autoFit);
  </script>
</body>
</html>
